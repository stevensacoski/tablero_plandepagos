<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan de Pagos · Recupero a Hospitales</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Encode+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* Paleta institucional — Manual de Marca MS PBA 2024 */
    --mds-magenta:#E81F76; --mds-azul:#417099; --mds-turquesa:#00AEC3;
    --mds-gradient:linear-gradient(90deg,#E81F76 0%,#417099 55%,#00AEC3 100%);
    --azul:#417099; --azul-osc:#0F2A3D; --azul-claro:#E9F0F6; --magenta:#E81F76;
    --verde:#147A3D; --amarillo:#A15C00; --rojo:#A1291B; --violeta:#6B3FA0;
    --gris:#5B6672; --gris-cl:#8A939E; --linea:#DFE4EA; --fondo:#F4F6F9;
    --panel:#fff; --radio:8px;
    --sombra:0 1px 3px rgba(15,36,56,.08), 0 1px 2px rgba(15,36,56,.06);
    --sombra-md:0 4px 16px rgba(15,36,56,.10);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--fondo);color:var(--azul-osc);
    font:14px/1.45 "Roboto",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em;
    font-family:"Encode Sans","Roboto",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
  button{font:inherit;cursor:pointer} a{color:var(--azul)}
  .mono{font-family:ui-monospace,Consolas,monospace}

  /* ---------- gate / carga ---------- */
  .gate{min-height:100vh;display:grid;place-items:center;background:var(--mds-gradient);padding:20px}
  .gate-logo{display:block;height:66px;margin:0 auto 22px;width:auto;filter:drop-shadow(0 2px 6px rgba(0,0,0,.25))}
  .gate-wrap{width:100%;max-width:480px}
  .gate-caja{background:#fff;border-radius:12px;padding:32px;width:100%;box-shadow:0 16px 50px rgba(0,0,0,.3)}
  .gate-caja h1{font-size:19px;margin-bottom:6px}
  .gate-caja .sub{color:var(--gris);font-size:13px;margin:0 0 20px}
  .gate-lista{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .gate-lista button{padding:13px;border:1px solid var(--linea);background:#fff;border-radius:8px;
    font-size:14px;font-weight:600;color:var(--azul-osc);display:flex;align-items:center;gap:9px;text-align:left}
  .gate-lista button:hover{border-color:var(--azul);background:var(--azul-claro);color:var(--azul)}
  .gate-pie{margin-top:20px;padding-top:16px;border-top:1px solid var(--linea);font-size:11.5px;color:var(--gris-cl);line-height:1.5}
  .avatar{width:24px;height:24px;border-radius:50%;background:var(--azul);color:#fff;
    display:grid;place-items:center;font-size:11px;font-weight:700;flex-shrink:0}
  .rolpill{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;
    color:var(--azul);background:var(--azul-claro);border-radius:999px;padding:1px 7px;margin-top:3px}
  .carga-caja{background:#fff;border-radius:12px;padding:34px 32px;width:100%;box-shadow:0 18px 50px rgba(15,36,56,.28);text-align:center}
  .carga-caja h1{font-size:20px;margin:0 0 8px;line-height:1.3}
  .carga-caja .sub{color:var(--gris);font-size:13.5px;margin:0 auto 24px;max-width:340px;line-height:1.55}
  .carga-barra{height:10px;border-radius:999px;background:#E6ECF2;overflow:hidden}
  .carga-progreso{height:100%;border-radius:999px;background:var(--mds-gradient);background-size:200% 100%;
    width:0;transition:width .3s ease;animation:carga-brillo 1.6s linear infinite}
  @keyframes carga-brillo{from{background-position:200% 0}to{background-position:0 0}}
  .carga-pct{margin-top:11px;font-size:12.5px;color:var(--gris);font-variant-numeric:tabular-nums}
  .carga-pct b{color:var(--azul)}

  /* ---------- topbar ---------- */
  .topbar{background:var(--mds-gradient);color:#fff;padding:0 20px;height:60px;display:flex;align-items:center;gap:14px;
    position:sticky;top:0;z-index:40;box-shadow:0 1px 0 rgba(0,0,0,.08)}
  .topbar .logo{height:38px;width:auto;display:block}
  .topbar .marca-divisor{width:1px;height:30px;background:rgba(255,255,255,.4)}
  .topbar .marca{font-family:"Encode Sans","Roboto",sans-serif;font-weight:600;font-size:15px;line-height:1.1}
  .topbar .marca small{display:block;font-weight:400;font-size:11px;opacity:.85}
  .topbar .sep{flex:1}
  .usuario-chip{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);border:0;color:#fff;
    padding:6px 12px;border-radius:20px;font-size:13px}
  .usuario-chip:hover{background:rgba(255,255,255,.24)}
  .usuario-chip .avatar{background:rgba(255,255,255,.25)}

  /* ---------- filtros ---------- */
  .filtros{position:sticky;top:60px;z-index:30;background:#fff;border-bottom:1px solid var(--linea);
    box-shadow:var(--sombra);padding:12px 20px;display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}
  .campo{display:flex;flex-direction:column;gap:4px;min-width:200px}
  .campo label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--gris)}
  .campo.hosp{flex:1 1 320px;max-width:520px} .campo.os{flex:1 1 220px;max-width:320px}
  select{background:#fff;color:var(--azul-osc);border:1px solid var(--linea);border-radius:7px;padding:9px 11px;font-size:13.5px;font-family:inherit;width:100%}
  select:focus,input:focus{outline:2px solid var(--azul);outline-offset:0;border-color:var(--azul)}
  .filtros .sep{flex:1}
  .mes-chip{background:var(--azul-claro);color:var(--azul);border:1px solid #C9DCF2;border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:600;white-space:nowrap}
  .btn-limpiar{background:#fff;border:1px solid var(--linea);color:var(--gris);border-radius:7px;padding:9px 13px;font-size:13px}
  .btn-limpiar:hover{border-color:var(--rojo);color:var(--rojo)}

  /* combobox predictivo hospital */
  .combo{position:relative}
  .combo input{width:100%;padding:9px 30px 9px 11px;border:1px solid var(--linea);border-radius:7px;font:inherit;background:#fff;color:var(--azul-osc)}
  .combo-x{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--gris-cl);font-size:19px;line-height:1;padding:2px 6px;display:none}
  .combo.has .combo-x{display:block} .combo-x:hover{color:var(--rojo)}
  .combo-list{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;border:1px solid var(--linea);border-radius:8px;
    box-shadow:0 12px 30px rgba(15,36,56,.18);max-height:340px;overflow:auto;z-index:50;display:none}
  .combo-list.open{display:block}
  .combo-opt{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:9px 12px;font-size:13px;cursor:pointer;
    border-bottom:1px solid var(--fondo);color:var(--azul-osc);line-height:1.3}
  .combo-opt:last-child{border-bottom:0}
  .combo-opt:hover,.combo-opt.hi{background:var(--azul-claro)}
  .combo-opt .nh{flex:1}
  .combo-opt .mto{color:var(--gris);font-size:11.5px;font-variant-numeric:tabular-nums;white-space:nowrap;flex-shrink:0;font-weight:700}
  .combo-empty{padding:12px;color:var(--gris-cl);font-size:12.5px}

  /* pestañas de sección */
  .tabs{display:flex;gap:8px;margin:22px 0 16px;flex-wrap:wrap}
  .tab{background:#fff;border:1px solid var(--linea);color:var(--gris);border-radius:999px;padding:10px 20px;font-size:13.5px;font-weight:700;font-family:"Encode Sans","Roboto",sans-serif}
  .tab:hover{border-color:var(--azul);color:var(--azul)}
  .tab.activo{background:var(--mds-gradient);border-color:transparent;color:#fff;box-shadow:var(--sombra-md)}

  .wrap{max-width:1460px;margin:0 auto;padding:20px 20px 70px}
  .scope-banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--gris);margin:4px 0 16px}
  .scope-banner b{color:var(--azul-osc)}
  .tag{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--linea);border-radius:999px;padding:4px 11px;font-size:12.5px}
  .tag.h{border-color:#C9DCF2;background:var(--azul-claro);color:var(--azul)}
  .tag.o{border-color:#F5C6DC;background:#FDEBF3;color:var(--magenta)}

  .note{background:#fff;border:1px solid var(--linea);border-left:3px solid var(--azul);border-radius:8px;
    padding:11px 14px;color:var(--gris);font-size:12.8px;margin-bottom:18px}
  .note b{color:var(--azul-osc)}

  h2.sec{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--gris-cl);font-weight:700;
    margin:28px 0 13px;display:flex;align-items:center;gap:10px}
  h2.sec::after{content:"";flex:1;height:1px;background:var(--linea)}

  /* KPIs */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .kpi{background:#fff;border:1px solid var(--linea);border-radius:var(--radio);padding:14px 15px;position:relative;overflow:hidden;box-shadow:var(--sombra)}
  .kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--azul)}
  .kpi.k-mag::before{background:var(--magenta)} .kpi.k-turq::before{background:var(--mds-turquesa)}
  .kpi.k-verde::before{background:var(--verde)} .kpi.k-amar::before{background:var(--amarillo)}
  .kpi.k-viol::before{background:var(--violeta)}
  .kpi .lab{color:var(--gris);font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase}
  .kpi .val{font-size:25px;font-weight:700;margin:7px 0 2px;letter-spacing:-.5px;font-family:"Encode Sans","Roboto",sans-serif}
  .kpi .sub{color:var(--gris-cl);font-size:11.5px}
  .kpi .pos{color:var(--verde)}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .card{background:#fff;border:1px solid var(--linea);border-radius:var(--radio);padding:16px 17px;box-shadow:var(--sombra);margin-bottom:16px}
  .card h3{font-size:15px;margin-bottom:3px}
  .badge-fijo{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;
    color:var(--gris);background:var(--fondo);border:1px solid var(--linea);border-radius:999px;padding:2px 9px;margin-left:8px;vertical-align:middle}
  .card h3 .info{font-weight:400;font-size:12px;color:var(--gris-cl);text-transform:none;letter-spacing:0}
  .card .hint{color:var(--gris-cl);font-size:12.3px;margin:0 0 13px}
  .card .tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:11px}
  .card .tools select{max-width:320px}

  /* incidencia 100% stacked */
  .incid{display:flex;width:100%;height:40px;border-radius:8px;overflow:hidden;border:1px solid var(--linea)}
  .incid .seg{height:100%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px;font-weight:700;
    overflow:hidden;white-space:nowrap;position:relative;transition:opacity .2s}
  .incid .seg.dim{opacity:.28}
  .incid-leg{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:13px}
  .incid-leg .it{display:flex;align-items:center;gap:7px;font-size:12.3px;color:var(--gris)}
  .incid-leg .it b{color:var(--azul-osc);font-variant-numeric:tabular-nums}
  .incid-leg .it.dim{opacity:.4}
  .incid-leg i{width:11px;height:11px;border-radius:3px;display:inline-block;flex-shrink:0}

  /* bar list */
  .bars{display:flex;flex-direction:column;gap:8px}
  .bar{display:grid;grid-template-columns:215px 1fr auto;gap:12px;align-items:center;font-size:12.6px}
  .bar.sel{background:#FFF7FB;border-radius:6px;margin:0 -6px;padding:2px 6px}
  .bar .nm{color:var(--gris);line-height:1.2;overflow-wrap:anywhere}
  .bar.sel .nm{color:var(--magenta);font-weight:700}
  .bar .track{background:var(--fondo);border-radius:5px;height:15px;overflow:hidden;border:1px solid var(--linea)}
  .bar .fill{height:100%;border-radius:5px 0 0 5px;min-width:2px}
  .bar .vv{color:var(--azul-osc);font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
  .empty{color:var(--gris-cl);font-size:12.5px;padding:8px 2px}

  /* tables */
  .tbl{width:100%;border-collapse:collapse;font-size:12.6px}
  .tbl thead th{text-align:right;padding:8px 10px;color:var(--gris);font-weight:700;border-bottom:2px solid var(--linea);white-space:nowrap}
  .tbl thead th:first-child{text-align:left}
  .tbl tbody td{padding:7px 10px;text-align:right;border-bottom:1px solid var(--linea);font-variant-numeric:tabular-nums;white-space:nowrap}
  .tbl tbody td:first-child{text-align:left;white-space:normal}
  .tbl tbody tr:hover{background:var(--fondo)}
  .tbl tbody tr.sel{background:#FDEBF3}
  .pill{font-size:11px;padding:2px 9px;border-radius:999px;border:1px solid;white-space:nowrap}
  .pill.int{color:var(--amarillo);border-color:#E7D3A8;background:#FBF4E6}
  .pill.sin{color:var(--mds-turquesa);border-color:#B5E6EC;background:#E8F8FA}
  .pos{color:var(--verde);font-weight:700}
  .mut{color:var(--gris-cl)}

  /* detail table with controlled scroll */
  .tblwrap{overflow:auto;border:1px solid var(--linea);border-radius:8px;max-height:520px}
  .tblwrap .tbl{min-width:760px}
  .tblwrap thead th{position:sticky;top:0;background:#fff;cursor:pointer;z-index:2;box-shadow:0 1px 0 var(--linea)}
  .tblwrap thead th .ar{opacity:.6;font-size:10px}
  .tbl tbody td:first-child{min-width:230px}

  .legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--gris);font-size:12px;margin-top:11px}
  .legend i{width:11px;height:11px;border-radius:3px;display:inline-block;margin-right:6px;vertical-align:-1px}

  .crono{display:flex;align-items:flex-end;gap:5px;height:150px;padding-top:6px}
  .crono .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
  .crono .stk{width:100%;max-width:24px;display:flex;flex-direction:column-reverse;border-radius:3px 3px 0 0;overflow:hidden}
  .crono .seg{width:100%}
  .crono .cx{color:var(--gris-cl);font-size:9px;margin-top:4px}
  .crono.proj{height:215px;gap:3px;align-items:flex-end;padding-top:56px}
  .crono.proj .pbar{width:100%;background:linear-gradient(180deg,#5a93bf,var(--azul));border-radius:3px 3px 0 0;min-height:2px;position:relative}
  .crono.proj .pbar.hl{background:linear-gradient(180deg,#f06aa0,var(--magenta))}
  .crono.proj .pv{position:absolute;bottom:calc(100% + 3px);left:50%;transform:translateX(-50%) rotate(180deg);
    writing-mode:vertical-rl;font-size:9px;color:var(--gris);white-space:nowrap;font-weight:700;font-variant-numeric:tabular-nums}
  .proj-ax{display:flex;gap:3px;margin-top:6px}
  .proj-ax .px{flex:1;text-align:center;font-size:9.5px;color:var(--gris-cl);white-space:nowrap;overflow:hidden}

  footer{margin-top:30px;color:var(--gris-cl);font-size:12px;text-align:center;border-top:1px solid var(--linea);padding-top:16px}

  .tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .proj-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

  @media(max-width:860px){ .kpis{grid-template-columns:repeat(2,1fr)} .grid2{grid-template-columns:1fr} .bar{grid-template-columns:170px 1fr auto} }

  /* ---------- celular ---------- */
  @media(max-width:640px){
    body{font-size:13.5px}
    .wrap{padding:16px 13px 56px}
    /* topbar compacto */
    .topbar{height:auto;min-height:52px;padding:8px 13px;gap:9px}
    .topbar .logo{height:28px}
    .topbar .marca{font-size:12.5px;line-height:1.15}
    .topbar .marca small{display:none}
    .marca-divisor{display:none}
    .usuario-chip{padding:6px 10px;font-size:12px}
    .usuario-chip .uname{display:none}
    /* filtros: no sticky, apilados y a todo el ancho */
    .filtros{position:static;padding:11px 13px;gap:10px}
    .campo{min-width:0;flex:1 1 100%}
    .campo.hosp,.campo.os{max-width:none;flex:1 1 100%}
    .filtros .sep{display:none}
    .btn-limpiar{flex:1 1 100%;padding:10px}
    /* contenido */
    .card{padding:13px 13px}
    .kpi .val{font-size:21px}
    h2.sec{margin:20px 0 11px}
    .tabs{gap:7px;margin:16px 0 14px}
    .tab{flex:1 1 auto;text-align:center;padding:10px 12px;font-size:12.5px}
    /* tablas que no entran → scroll horizontal propio */
    #tblPlanes{min-width:430px}
    /* proyección: scroll horizontal con barras usables */
    .proj-scroll .crono.proj, .proj-scroll .proj-ax{min-width:650px}
    .crono.proj{padding-top:50px}
    /* barras: nombre arriba de la barra para no comprimir */
    .bar{grid-template-columns:1fr auto;grid-template-areas:"nm nm" "track vv";row-gap:3px;column-gap:8px;padding:7px 0;border-bottom:1px solid var(--fondo)}
    .bar .nm{grid-area:nm;font-size:12.5px;color:var(--azul-osc)}
    .bar .track{grid-area:track;height:14px}
    .bar .vv{grid-area:vv}
    .bar.sel{margin:0;padding:7px 6px}
  }
  @media(max-width:480px){ .kpis{grid-template-columns:1fr} .gate-lista{grid-template-columns:1fr} .gate-caja{padding:24px 20px} }
</style>
</head>

<div id="app"></div>

const nf0=new Intl.NumberFormat('es-AR',{maximumFractionDigits:0});

const full=v=>'$ '+nf0.format(Math.round(v||0));
function moneyM(v){ if(v==null) return '—'; const m=v/1e6; const s=Math.abs(m)>=100?nf0.format(m):nf1.format(m); return '$ '+s+' M'; }
function pct(v,signed=true){ if(v==null) return '—'; return (signed&&v>=0?'+':'')+nf1.format(v*100)+'%'; }
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
function fmtMonth(s){try{return new Date(s+'T00:00:00').toLocaleDateString('es-AR',{month:'long',year:'numeric'});}catch(e){return s;}}
function fmtDate(s){try{return new Date(s+'T00:00:00').toLocaleDateString('es-AR');}catch(e){return s||'—';}}

const osColor={}; DATA.osOrder.forEach((o,i)=>osColor[o]=OS_COLORS[i%OS_COLORS.length]);

const hospByNameLC={}; DATA.hospitals.forEach(h=>hospByNameLC[h.hospital.toLowerCase()]=h.hospital);
const planByOs={}; DATA.planes.forEach(p=>planByOs[p.os]=p);
const sumDeuda=DATA.planes.reduce((a,p)=>a+(p.deudaTotal||0),0);
/* total a recuperar por el plan = suma de la deuda del hospital con todos los financiadores */
const totalARecuperar={}; DATA.hospitals.forEach(h=>{const m=DATA.deudaMatrix[h.hospital]||{}; totalARecuperar[h.hospital]=Object.values(m).reduce((a,b)=>a+(b||0),0);});
/* hospitales ordenados de mayor a menor monto a recuperar; obras sociales alfabético */
const HOSP_ORDEN=DATA.hospitals.map(h=>h.hospital).sort((a,b)=>(totalARecuperar[b]||0)-(totalARecuperar[a]||0));
const OS_ALFA=DATA.osOrder.slice().sort((a,b)=>a.localeCompare(b,'es'));

/* parametrización: fracción de la cuota de una OS que va a un hospital */
const paramHO=(h,o)=>{const b=((DATA.mmHosp[h]||{}).brk||{})[o]||0; const c=DATA.mmOsTransfer[o]||0; return c? b/c : 0;};
/* cronograma de cuotas (planes con interés) → {OS:{cuota:monto}} */
const cronMap={}; DATA.cronOs.forEach((o,i)=>{cronMap[o]={}; DATA.cronRows.forEach(r=>{if(Number.isFinite(r.cuota)) cronMap[o][r.cuota]=r.vals[i]||0;});});
/* obras sociales que afectan a un hospital (tienen deuda con él) */

/* monto de una OS en el alcance actual (deuda del hospital con la OS, o deuda total) */
function osMonto(o){ return state.F.hosp==='ALL' ? (planByOs[o]||{}).deudaTotal : (DATA.deudaMatrix[state.F.hosp]||{})[o]; }

/* combobox predictivo genérico */
function makeCombo({boxId,inputId,listId,clearId,items,current,onPick}){
  const inp=document.getElementById(inputId), box=document.getElementById(boxId),
        list=document.getElementById(listId), clr=document.getElementById(clearId);
  let hi=-1, vis=[];
  function build(q){
    q=(q||'').trim().toLowerCase();
    vis=items().filter(it=>!q || it.label.toLowerCase().includes(q));
    hi=-1;
    list.innerHTML = vis.length ? vis.map((it,i)=>`<div class="combo-opt" data-i="${i}">
        <span class="nh">${esc(it.label)}</span><span class="mto">${it.sub||''}</span></div>`).join('')
      : '<div class="combo-empty">Sin coincidencias</div>';
  }
  function open(){ const cur=current(); build(inp.value===cur && cur ? '' : inp.value); list.classList.add('open'); }
  function close(){ list.classList.remove('open'); }
  function choose(it){ inp.value=it.label; box.classList.add('has'); close(); onPick(it.value); }
  function clear(){ inp.value=''; box.classList.remove('has'); close(); onPick(null); }
  inp.addEventListener('focus',open);
  inp.addEventListener('input',()=>{ build(inp.value); list.classList.add('open'); });
  inp.addEventListener('keydown',e=>{
    const opts=[...list.querySelectorAll('.combo-opt')];
    if(e.key==='ArrowDown'){e.preventDefault(); hi=Math.min(hi+1,opts.length-1);}
    else if(e.key==='ArrowUp'){e.preventDefault(); hi=Math.max(hi-1,0);}
    else if(e.key==='Enter'){e.preventDefault(); if(vis.length) choose(vis[hi<0?0:hi]); return;}
    else if(e.key==='Escape'){close(); return;}
    else return;
    opts.forEach((o,i)=>o.classList.toggle('hi',i===hi));
    if(opts[hi]) opts[hi].scrollIntoView({block:'nearest'});
  });
  list.addEventListener('mousedown',e=>{ const o=e.target.closest('.combo-opt'); if(o){e.preventDefault(); choose(vis[+o.dataset.i]);} });
  clr.addEventListener('click',clear);
  inp.addEventListener('blur',()=>setTimeout(close,120));
  function refresh(){ const cur=current(); inp.value = cur==='ALL'||!cur ? '' : cur; box.classList.toggle('has', cur!=='ALL'&&!!cur); }
  refresh();
  return {refresh};
}

  document.getElementById('app').innerHTML=`<div class="gate"><div class="gate-wrap">${logo}
    <div class="gate-caja">
      <h1>Tablero · Plan de Pagos</h1>
      <p class="sub">Elegí tu perfil para entrar. Recupero a hospitales y seguimiento de los planes de pago de los financiadores.</p>

function viewCarga(){
  const logo=`<img class="gate-logo" src="${LOGO}" alt="Ministerio de Salud">`;
  document.getElementById('app').innerHTML=`<div class="gate"><div class="gate-wrap">${logo}
    <div class="carga-caja">
      <h1>Te damos la bienvenida, ${esc(state.user.nombre)}</h1>
      <p class="sub">Aguardá unos instantes, estamos cargando la información del plan de pagos.</p>
      <div class="carga-barra"><div class="carga-progreso" id="prog"></div></div>
      <div class="carga-pct" id="progtxt">Preparando la información…</div>
    </div></div></div>`;
  const prog=document.getElementById('prog'), txt=document.getElementById('progtxt');
  let p=0; const steps=[18,42,67,88,100];let i=0;
  const tick=()=>{ p=steps[i++]; prog.style.width=p+'%'; txt.innerHTML=p<100?`Cargando datos… <b>${p}%</b>`:`Listo · <b>100%</b>`;
    if(p<100) setTimeout(tick, 230); else setTimeout(viewApp, 320); };
  setTimeout(tick, 250);
}

/* ---------- scope helpers ---------- */
function deudaPorOs(){ // respeta filtro hospital
  if(state.F.hosp==='ALL') return DATA.osOrder.map(o=>({os:o,v:DATA.deudaOsTotal[o]||0}));
  const m=DATA.deudaMatrix[state.F.hosp]||{};
  return DATA.osOrder.map(o=>({os:o,v:m[o]||0}));
}
function mesPorOs(){
  if(state.F.hosp==='ALL') return DATA.osOrder.map(o=>({os:o,v:DATA.mmOsTransfer[o]||0}));
  const b=(DATA.mmHosp[state.F.hosp]||{}).brk||{};
  return DATA.osOrder.map(o=>({os:o,v:b[o]||0}));
}

/* ---------- cambios de filtro ---------- */
function setHosp(n){
  state.F.hosp = n || 'ALL';
  // si la OS elegida ya no afecta a este hospital, la quito
  if(state.F.os!=='ALL' && state.F.hosp!=='ALL' && !((DATA.deudaMatrix[state.F.hosp]||{})[state.F.os]>0)) state.F.os='ALL';
  render();
}
function setOs(o){ state.F.os = o || 'ALL'; if(o) state.distribOs=o; render(); }

/* ---------- render maestro ---------- */
function render(){ renderScope(); renderKpis(); renderIncid(); renderDeudaOs(); renderPlanes(); renderComp(); renderDistrib(); renderRankings(); renderTimeline(); renderTabla();
  if(hospCombo)hospCombo.refresh(); if(osCombo)osCombo.refresh(); }

function renderScope(){
  const {hosp,os}=state.F; const parts=[];
  parts.push('<span>Mostrando:</span>');
  parts.push(hosp==='ALL'?'<span class="tag">Todos los hospitales</span>':`<span class="tag h">🏥 ${esc(hosp)}</span>`);
  parts.push(os==='ALL'?'<span class="tag">Todas las obras sociales</span>':`<span class="tag o">◆ ${esc(os)}</span>`);
  document.getElementById('scope').innerHTML=parts.join(' ');
}

/* ---------- KPIs adaptativos ---------- */
function renderKpis(){
  const {hosp,os}=state.F; const t=DATA.totals; let k=[];
  const C=(lab,val,sub,cls,pos)=>({lab,val,sub,cls:cls||'',pos:!!pos});
  if(hosp==='ALL'&&os==='ALL'){
    k=[C('Deuda total regularizada',moneyM(sumDeuda),DATA.planes.length+' planes de pago'),
       C('Recupero mensual del plan',moneyM(t.recuperoPlanMensual),'cuota mensual × parametrización','k-turq'),
       C('Incremento del recupero',pct(t.incrementoRecupero),'vs. histórico promedio','k-verde',1),
       C('Incremento de bonificaciones',pct(t.incrementoBonif),'promedio → con plan','k-amar',1),
       C('Apoyo financiero (10%)',moneyM(t.apoyoFinanciero),'10% del recupero / mes','k-viol'),
       C('Hospitales alcanzados',nf0.format(DATA.hospitals.length),'reciben distribución'),
       C('Recupero histórico prom.',moneyM(t.recuperoPromedio),'base mensual sin plan','k-turq'),
       C('Agentes (promedio)',nf0.format(t.agentesProm),'base de cálculo bonif.')];
  } else if(hosp!=='ALL'&&os==='ALL'){
    const h=hospByName[hosp]||{}; const dm=DATA.deudaMatrix[hosp]||{};
    const deudaH=Object.values(dm).reduce((a,b)=>a+(b||0),0);
    const nFin=DATA.osOrder.filter(o=>(dm[o]||0)>0).length;
    k=[C('Total a recuperar',moneyM(deudaH),nFin+' financiadores le adeudan'),
       C('Recupero mensual del plan',moneyM(h.recuperoPlanMensual),'recibe por mes','k-turq'),
       C('Incremento del recupero',pct(h.incrementoRecupero),'vs. su histórico','k-verde',1),
       C('Incremento de bonificaciones',pct(h.incrementoBonif),'promedio → con plan','k-amar',1),
       C('Apoyo financiero (10%)',moneyM(h.apoyoFinanciero),'para el hospital / mes','k-viol'),
       C('Recupero histórico prom.',moneyM(h.recuperoPromedio),'base mensual sin plan','k-turq'),
       C('Bonificaciones c/ plan',moneyM(h.bonifConPlan),'desde '+moneyM(h.bonifPromedio)+' prom.'),
       C('Agentes (promedio)',nf0.format(h.agentesProm),'base de cálculo bonif.')];
  } else if(hosp==='ALL'&&os!=='ALL'){
    const p=planByOs[os]||{}; const con=/con/i.test(p.interes||'');
    const mesOs=DATA.mmOsTransfer[os]||0;
    const nH=DATA.hospitals.filter(h=>((DATA.mmHosp[h.hospital]||{}).brk||{})[os]>0).length;
    k=[C('Deuda del financiador',moneyM(p.deudaTotal),'regularizada en el plan','k-mag'),
       C('Cuota mensual del plan',moneyM(mesOs),'a distribuir entre hospitales','k-turq'),
       C('Incidencia en deuda total',pct(p.deudaTotal/sumDeuda,false),'del total regularizado','k-verde'),
       C('Plan',p.cuotas+' cuotas',con?'con interés':'sin interés','k-amar'),
       C('Apoyo financiero (10%)',moneyM(mesOs*0.10),'10% de la cuota mensual','k-viol'),
       C('Hospitales que reciben',nf0.format(nH),'tienen facturas de esta OS'),
       C('Venc. 1ª cuota',fmtDate(p.venc),'inicio del plan','k-turq')];
  } else {
    const p=planByOs[os]||{}; const b=((DATA.mmHosp[hosp]||{}).brk||{})[os]||0;
    const dHO=(DATA.deudaMatrix[hosp]||{})[os]||0;
    const totMesH=(DATA.mmHosp[hosp]||{}).total||0;
    const mesOs=DATA.mmOsTransfer[os]||0;
    k=[C('Transfiere por mes',moneyM(b),`${esc(os)} → hospital`,'k-turq'),
       C('Deuda de esta OS en el hospital',moneyM(dHO),'monto regularizado','k-mag'),
       C('% del mes del hospital',b&&totMesH?pct(b/totMesH,false):'—','que aporta esta OS'),
       C('% de la OS a este hospital',mesOs?pct(b/mesOs,false):'—','de la cuota del mes de la OS','k-mag')];
  }
  const w=document.getElementById('kpis'); w.innerHTML='';
  k.forEach(x=>w.appendChild(el('div','kpi '+x.cls,`<div class="lab">${x.lab}</div><div class="val ${x.pos?'pos':''}">${x.val}</div><div class="sub">${x.sub}</div>`)));
}

/* ---------- barras genéricas ---------- */
function barList(cont,rows,opt={}){
  cont.innerHTML=''; if(!rows.length){cont.innerHTML='<div class="empty">Sin datos para esta combinación de filtros.</div>';return;}
  const max=Math.max(...rows.map(r=>r.v),1e-9);
  rows.forEach(r=>{
    const sel=opt.selName&&r.name===opt.selName;
    const row=el('div','bar'+(sel?' sel':''));
    row.innerHTML=`<span class="nm" title="${esc(r.name)}">${esc(r.short||r.name)}</span>
      <span class="track"><span class="fill" style="width:${Math.max(r.v/max*100,1.5)}%;background:${r.color||'linear-gradient(90deg,#2f5f86,#417099)'}"></span></span>
      <span class="vv">${r.label}</span>`;
    cont.appendChild(row);
  });
}

/* ---------- incidencia ---------- */
function renderIncid(){
  const rows=deudaPorOs().filter(r=>r.v>0).sort((a,b)=>b.v-a.v);
  const tot=rows.reduce((a,r)=>a+r.v,0);
  const bar=document.getElementById('incid'), leg=document.getElementById('incidLeg');
  bar.innerHTML=''; leg.innerHTML='';
  const tit=document.getElementById('incidTit'), hint=document.getElementById('incidHint');
  if(state.F.hosp==='ALL'){tit.textContent='Incidencia de cada financiador en la deuda total'; hint.textContent='Participación de cada obra social sobre el total regularizado, de mayor a menor.';}
  else {tit.textContent='Incidencia por financiador en '+shortHosp(state.F.hosp); hint.textContent='Composición de la deuda de este hospital por obra social ('+full(tot)+').';}
  if(!tot){bar.innerHTML='';leg.innerHTML='<span class="mut">Sin deuda registrada.</span>';return;}
  rows.forEach(r=>{
    const share=r.v/tot; const dim=state.F.os!=='ALL'&&r.os!==state.F.os;
    const seg=el('div','seg'+(dim?' dim':'')); seg.style.flexBasis=(share*100)+'%'; seg.style.background=osColor[r.os];
    seg.title=`${r.os}: ${full(r.v)} (${nf1.format(share*100)}%)`;
    if(share>=0.028) seg.textContent=nf1.format(share*100)+'%';
    bar.appendChild(seg);
    leg.appendChild(el('span','it'+(dim?' dim':''),`<i style="background:${osColor[r.os]}"></i>${esc(r.os)} <b>${nf1.format(share*100)}%</b>`));
  });
}

function renderDeudaOs(){
  const rows=deudaPorOs().filter(r=>r.v>0).sort((a,b)=>b.v-a.v)
    .map(r=>({name:r.os,v:r.v,label:moneyM(r.v),color:osColor[r.os]}));
  document.getElementById('deudaOsTit').textContent = state.F.hosp==='ALL'?'Deuda regularizada por financiador':'Deuda por financiador · '+shortHosp(state.F.hosp);
  barList(document.getElementById('barsDeudaOs'),rows,{selName:state.F.os});
}

function renderPlanes(){
  const tb=document.querySelector('#tblPlanes tbody'); tb.innerHTML='';

function renderComp(){
  const rows=mesPorOs().filter(r=>r.v>0).sort((a,b)=>b.v-a.v)

function renderDistrib(){
  const os= state.F.os!=='ALL'? state.F.os : state.distribOs;
  const sd=document.getElementById('selDistrib'); if(sd){sd.value=os; sd.disabled=(state.F.os!=='ALL');}
  const cuotaOs=DATA.mmOsTransfer[os]||0; // = cuota mensual del plan de esa OS
  const rows=DATA.hospitals.map(h=>({name:h.hospital,short:shortHosp(h.hospital),v:((DATA.mmHosp[h.hospital]||{}).brk||{})[os]||0}))
    .filter(r=>r.v>0).sort((a,b)=>b.v-a.v).slice(0,15)
    .map(r=>({...r,label:moneyM(r.v)+(cuotaOs?' · '+nf1.format(r.v/cuotaOs*100)+'%':''),color:osColor[os]}));
  barList(document.getElementById('barsDistrib'),rows,{selName:state.F.hosp});

function renderRankings(){
  const H=DATA.hospitals;
  const r1=H.slice().sort((a,b)=>b.recuperoPlanMensual-a.recuperoPlanMensual).slice(0,15)
    .map(h=>({name:h.hospital,short:shortHosp(h.hospital),v:h.recuperoPlanMensual,label:moneyM(h.recuperoPlanMensual),color:'linear-gradient(90deg,#0c7d72,#00AEC3)'}));
  barList(document.getElementById('barsTopRec'),r1,{selName:state.F.hosp});
  const r2=H.slice().filter(h=>h.incrementoRecupero!=null).sort((a,b)=>b.incrementoRecupero-a.incrementoRecupero).slice(0,15)
    .map(h=>({name:h.hospital,short:shortHosp(h.hospital),v:h.incrementoRecupero,label:pct(h.incrementoRecupero),color:'linear-gradient(90deg,#0f5e30,#147A3D)'}));
  barList(document.getElementById('barsTopInc'),r2,{selName:state.F.hosp});

function renderTabla(){
  const tb=document.querySelector('#tblHosp tbody'), cnt=document.getElementById('cnt');
  let rows=DATA.hospitals.filter(h=>h.hospital.toLowerCase().includes(state.q));
  if(state.F.hosp!=='ALL') rows=rows.filter(h=>h.hospital===state.F.hosp);
  rows.sort((a,b)=>{let x=a[state.sortK],y=b[state.sortK];
    if(state.sortK==='hospital'){x=x.toLowerCase();y=y.toLowerCase();return state.asc?(x<y?-1:1):(x>y?-1:1);}
    x=x==null?-Infinity:x;y=y==null?-Infinity:y;return state.asc?x-y:y-x;});
  tb.innerHTML='';
  rows.forEach(h=>{
    const tr=el('tr',h.hospital===state.F.hosp?'sel':'');
    tr.innerHTML=`<td title="${esc(h.hospital)}">${esc(h.hospital)}</td>
      <td>${moneyM(h.recuperoPromedio)}</td><td>${moneyM(h.recuperoPlanMensual)}</td>
      <td><span class="pos">${pct(h.incrementoRecupero)}</span></td>
      <td>${moneyM(h.bonifPromedio)}</td><td>${moneyM(h.bonifConPlan)}</td>
      <td><span class="pos">${pct(h.incrementoBonif)}</span></td><td>${moneyM(h.apoyoFinanciero)}</td>`;
    tb.appendChild(tr);
  });
  cnt.textContent=rows.length+' hospital'+(rows.length===1?'':'es');
  document.querySelectorAll('#tblHosp thead th').forEach(th=>{const ar=th.querySelector('.ar'); if(ar) ar.textContent = th.dataset.k===state.sortK?(state.asc?'▲':'▼'):'';});
}

/* ---------- proyección temporal del recupero ---------- */
function renderTimeline(){
  const cont=document.getElementById('proj'), ax=document.getElementById('projAx'); if(!cont) return;
  cont.innerHTML=''; ax.innerHTML='';
  const {hosp,os}=state.F;
  const mi=ym=>{const a=(ym||'').split('-').map(Number); return a.length>=2? a[0]*12+(a[1]-1):NaN;};
  const months={};
  DATA.planes.forEach(p=>{
    if(os!=='ALL' && p.os!==os) return;
    const factor = hosp==='ALL' ? 1 : paramHO(hosp,p.os);
    if(!factor) return;
    const con=/con/i.test(p.interes||'');
    const start=mi((p.venc||'').slice(0,7)); if(!Number.isFinite(start)) return;
    for(let k=1;k<=p.cuotas;k++){
      const amt = con ? ((cronMap[p.os]||{})[k]||0) : p.cuotaMes;
      months[start+(k-1)]=(months[start+(k-1)]||0)+amt*factor;
    }
  });
  const idxs=Object.keys(months).map(Number).sort((a,b)=>a-b);
  const scopeEl=document.getElementById('projScope');
  if(!idxs.length){ cont.innerHTML='<div class="empty">Sin datos para esta combinación.</div>'; scopeEl.textContent=''; return; }
  const first=idxs[0], last=idxs[idxs.length-1], all=[];
  for(let i=first;i<=last;i++) all.push(i);
  const max=Math.max(...all.map(i=>months[i]||0),1);
  const mLabel=idx=>{const d=new Date(Math.floor(idx/12),idx%12,1); return d.toLocaleDateString('es-AR',{month:'short'}).replace('.','')+' '+String(d.getFullYear()).slice(2);};
  const n=all.length, every = n<=14?1:(n<=28?2:3);
  all.forEach((idx,i)=>{
    const v=months[idx]||0;
    const col=el('div','col'), bar=el('div','pbar'+(os!=='ALL'?' hl':''));
    bar.style.height=Math.max(v/max*140,2)+'px'; bar.title=mLabel(idx)+': '+moneyM(v);
    bar.appendChild(el('span','pv',moneyM(v)));
    col.appendChild(bar); cont.appendChild(col);
    ax.appendChild(el('div','px', i%every===0?mLabel(idx):''));
  });
  const tot=all.reduce((a,i)=>a+(months[i]||0),0);
  scopeEl.textContent = hosp==='ALL'&&os==='ALL' ? 'todos'
    : [hosp!=='ALL'?shortHosp(hosp):null, os!=='ALL'?os:null].filter(Boolean).join(' · ');
  document.getElementById('projHint').innerHTML='Cuánto ingresa por mes a medida que se pagan las cuotas; baja cuando cada plan termina. Total proyectado del período: <b>'+full(tot)+'</b> en '+n+' meses.';
}

/* arranque */
viewGate();
</script>
